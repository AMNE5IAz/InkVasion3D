<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkvasion 3D</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f0df;
      --ink: #181715;
      --blue: #0a68d8;
      --red: #c7262e;
      --muted: #57534a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ded8c6;
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
    }

    #game {
      position: fixed;
      inset: 0;
      background: var(--paper);
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 12px;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .hud-panel {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      min-height: 34px;
      padding: 8px 10px;
      border: 2px solid rgba(24, 23, 21, 0.75);
      background: rgba(245, 240, 223, 0.78);
      box-shadow: 3px 3px 0 rgba(24, 23, 21, 0.14);
      backdrop-filter: blur(3px);
    }

    .hud-panel.center {
      justify-content: center;
      text-align: center;
    }

    .hud-panel.right {
      justify-content: flex-end;
      text-align: right;
    }

    .stat {
      white-space: nowrap;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .bar {
      width: min(220px, 30vw);
      height: 12px;
      border: 2px solid var(--ink);
      background: rgba(24, 23, 21, 0.08);
    }

    .bar-fill {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        -12deg,
        var(--blue),
        var(--blue) 8px,
        #2f89ef 8px,
        #2f89ef 12px
      );
      transition: width 120ms linear;
    }

    .special-bar {
      width: min(150px, 20vw);
    }

    .special-fill {
      width: 0%;
      background: repeating-linear-gradient(
        -12deg,
        #111,
        #111 8px,
        #4b3a85 8px,
        #4b3a85 12px
      );
    }

    #message {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 6;
      max-width: min(620px, calc(100vw - 32px));
      padding: 10px 14px;
      border: 2px solid rgba(24, 23, 21, 0.85);
      background: rgba(245, 240, 223, 0.88);
      box-shadow: 4px 4px 0 rgba(24, 23, 21, 0.16);
      color: var(--ink);
      text-align: center;
      font-weight: 700;
      opacity: 0;
      transition: opacity 160ms ease;
      pointer-events: none;
    }

    #message.visible {
      opacity: 1;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(245, 240, 223, 0.68);
      backdrop-filter: blur(4px);
    }

    #overlay.visible {
      display: flex;
    }

    .overlay-card {
      width: min(520px, calc(100vw - 32px));
      border: 3px solid var(--ink);
      background: rgba(250, 247, 235, 0.96);
      box-shadow: 8px 8px 0 rgba(24, 23, 21, 0.18);
      padding: 24px;
      text-align: center;
    }

    .overlay-card h1 {
      margin: 0 0 10px;
      color: var(--red);
      font-size: clamp(28px, 7vw, 52px);
      line-height: 1;
      letter-spacing: 0;
    }

    .overlay-card p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      min-width: 132px;
      border: 2px solid var(--ink);
      background: var(--blue);
      color: white;
      padding: 10px 14px;
      font: 700 14px "Courier New", Courier, monospace;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(24, 23, 21, 0.22);
    }

    button.secondary {
      background: #fff9e9;
      color: var(--ink);
    }

    #fallback {
      position: fixed;
      inset: auto 16px 16px 16px;
      z-index: 20;
      display: none;
      border: 2px solid var(--red);
      background: #fff9e9;
      padding: 12px;
      font-weight: 700;
    }

    @media (max-width: 740px) {
      #hud {
        grid-template-columns: 1fr;
      }

      .hud-panel,
      .hud-panel.right {
        justify-content: center;
        text-align: center;
      }

      .stat {
        font-size: 12px;
      }

      .bar {
        width: min(260px, 72vw);
      }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Inkvasion 3D game viewport"></main>

  <section id="hud" aria-label="Game status">
    <div class="hud-panel">
      <span class="stat">Health</span>
      <div class="bar" aria-hidden="true"><div id="healthFill" class="bar-fill"></div></div>
      <span id="healthText" class="stat">100</span>
      <span class="stat">Splash</span>
      <div class="bar special-bar" aria-hidden="true"><div id="specialFill" class="bar-fill special-fill"></div></div>
    </div>
    <div class="hud-panel center">
      <span id="levelName" class="stat">Loading page...</span>
    </div>
    <div class="hud-panel right">
      <span id="enemyText" class="stat">Enemies 0</span>
      <span id="modeText" class="stat">Mode Deathmatch</span>
      <span class="stat">Hold Space: Splash</span>
      <span class="stat">M Mode</span>
    </div>
  </section>

  <div id="message"></div>

  <section id="overlay" aria-live="polite">
    <div class="overlay-card">
      <h1 id="overlayTitle">Inkvasion</h1>
      <p id="overlayBody">Loading the sketchbook battlefield.</p>
      <div class="button-row">
        <button id="restartButton" type="button">Restart Page</button>
        <button id="nextButton" class="secondary" type="button">Next Page</button>
      </div>
    </div>
  </section>

  <div id="fallback">
    WebGL could not start in this browser. Try a modern desktop browser with hardware acceleration enabled.
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    const TAU = Math.PI * 2;
    const keys = new Set();
    const tmpVec = new THREE.Vector3();
    const tmpVec2 = new THREE.Vector3();
    const arenaBounds = { minX: -42, maxX: 42, minZ: -28, maxZ: 28 };

    const palette = {
      paper: 0xf5f0df,
      paperDark: 0xd8cfb5,
      ink: 0x181715,
      blue: 0x0a68d8,
      blueWash: 0x82bdf7,
      red: 0xc7262e,
      redWash: 0xf0a0a3,
      graphite: 0x4f4b44
    };

    const gameModes = ["Deathmatch", "Team Deathmatch", "Capture The Flag", "Control Points"];

    const tankArchetypes = {
      striker: { label: "Striker", maxHealth: 100, maxSpeed: 8.5, acceleration: 15, turnSpeed: 2.25, turretTurnSpeed: 3.8, fireDelay: 0.46, damage: 18, bodyScale: [1, 1, 1] },
      scout: { label: "Scout", maxHealth: 75, maxSpeed: 10.8, acceleration: 18, turnSpeed: 2.65, turretTurnSpeed: 4.2, fireDelay: 0.34, damage: 13, bodyScale: [0.88, 0.9, 0.9] },
      heavy: { label: "Heavy", maxHealth: 145, maxSpeed: 6.0, acceleration: 10, turnSpeed: 1.55, turretTurnSpeed: 2.7, fireDelay: 0.8, damage: 30, bodyScale: [1.22, 1.12, 1.18] },
      rail: { label: "Rail", maxHealth: 85, maxSpeed: 7.4, acceleration: 12, turnSpeed: 1.9, turretTurnSpeed: 3.1, fireDelay: 1.15, damage: 42, bodyScale: [0.96, 0.95, 1.05] }
    };

    const levels = [
      {
        name: "Ink Wastes",
        mode: "Deathmatch",
        player: [-34, -18],
        enemies: [[27, -20, "scout"], [30, 17, "heavy"], [4, 22, "rail"], [-14, 10, "striker"], [16, -4, "scout"]],
        objectives: [{ type: "point", x: 0, z: 0, r: 3.6 }],
        obstacles: [
          { x: -12, z: -10, w: 11, d: 5, h: 2.2 }, { x: 11, z: 8, w: 14, d: 4, h: 2.8 },
          { x: -29, z: 8, w: 6, d: 14, h: 2.6 }, { x: 29, z: -7, w: 7, d: 16, h: 2.6 },
          { x: 0, z: -23, w: 18, d: 3, h: 2.1 }, { x: -2, z: 23, w: 18, d: 3, h: 2.1 },
          { x: 0, z: 0, w: 6, d: 6, h: 1.4 }
        ]
      },
      {
        name: "Folded City",
        mode: "Team Deathmatch",
        player: [-35, 20],
        enemies: [[35, -20, "heavy"], [23, -4, "striker"], [10, 18, "scout"], [-4, -18, "rail"], [34, 14, "scout"], [-22, -4, "striker"]],
        allies: [[-30, 8, "scout"], [-18, 20, "heavy"]],
        obstacles: [
          { x: -25, z: 0, w: 5, d: 38, h: 3.2 }, { x: -8, z: -7, w: 5, d: 30, h: 3.2 },
          { x: 8, z: 7, w: 5, d: 30, h: 3.2 }, { x: 25, z: 0, w: 5, d: 38, h: 3.2 },
          { x: 0, z: -24, w: 20, d: 3, h: 2.4 }, { x: 0, z: 24, w: 20, d: 3, h: 2.4 },
          { x: -16, z: 13, w: 12, d: 3, h: 2.2 }, { x: 16, z: -13, w: 12, d: 3, h: 2.2 }
        ]
      },
      {
        name: "Blot Flag Basin",
        mode: "Capture The Flag",
        player: [-36, 0],
        enemies: [[35, 0, "heavy"], [28, -17, "scout"], [28, 17, "scout"], [8, 18, "rail"], [8, -18, "striker"]],
        allies: [[-27, -15, "scout"], [-27, 15, "striker"]],
        flags: { blue: [-36, 0], red: [36, 0] },
        obstacles: [
          { x: -17, z: -18, w: 18, d: 3, h: 2.5 }, { x: -17, z: 18, w: 18, d: 3, h: 2.5 },
          { x: 17, z: -18, w: 18, d: 3, h: 2.5 }, { x: 17, z: 18, w: 18, d: 3, h: 2.5 },
          { x: 0, z: -7, w: 5, d: 18, h: 3 }, { x: 0, z: 18, w: 5, d: 12, h: 3 },
          { x: -31, z: 0, w: 4, d: 10, h: 2 }, { x: 31, z: 0, w: 4, d: 10, h: 2 }
        ]
      },
      {
        name: "Three Point Spillway",
        mode: "Control Points",
        player: [-33, -20],
        enemies: [[33, 20, "heavy"], [24, -4, "rail"], [6, 23, "scout"], [-11, 8, "striker"], [31, -21, "scout"], [-30, 17, "heavy"]],
        allies: [[-24, -6, "scout"], [-18, -21, "striker"]],
        objectives: [{ type: "point", x: -22, z: 0, r: 4 }, { type: "point", x: 0, z: 0, r: 4 }, { type: "point", x: 22, z: 0, r: 4 }],
        obstacles: [
          { x: -32, z: 0, w: 5, d: 28, h: 2.7 }, { x: 32, z: 0, w: 5, d: 28, h: 2.7 },
          { x: 0, z: -22, w: 42, d: 4, h: 2.4 }, { x: 0, z: 22, w: 42, d: 4, h: 2.4 },
          { x: -12, z: -6, w: 5, d: 12, h: 2.5 }, { x: 12, z: 6, w: 5, d: 12, h: 2.5 },
          { x: 0, z: 0, w: 7, d: 7, h: 1.5 }
        ]
      }
    ];

    const ui = {
      root: document.getElementById("game"),
      healthFill: document.getElementById("healthFill"),
      specialFill: document.getElementById("specialFill"),
      healthText: document.getElementById("healthText"),
      enemyText: document.getElementById("enemyText"),
      modeText: document.getElementById("modeText"),
      levelName: document.getElementById("levelName"),
      message: document.getElementById("message"),
      overlay: document.getElementById("overlay"),
      overlayTitle: document.getElementById("overlayTitle"),
      overlayBody: document.getElementById("overlayBody"),
      restartButton: document.getElementById("restartButton"),
      nextButton: document.getElementById("nextButton"),
      fallback: document.getElementById("fallback")
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function normalizeAngle(angle) {
      while (angle <= -Math.PI) angle += TAU;
      while (angle > Math.PI) angle -= TAU;
      return angle;
    }

    function angleDiff(target, current) {
      return normalizeAngle(target - current);
    }

    function createPaperTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f5f0df";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(86, 132, 210, 0.28)";
      ctx.lineWidth = 2;
      for (let y = 40; y < canvas.height; y += 48) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y + Math.sin(y) * 3);
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(207, 51, 57, 0.28)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(92, 0);
      ctx.lineTo(92, canvas.height);
      ctx.stroke();
      for (let i = 0; i < 900; i++) {
        const alpha = Math.random() * 0.05;
        ctx.fillStyle = `rgba(24, 23, 21, ${alpha})`;
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeMaterial(color, roughness = 0.8) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness: 0.02
      });
    }

    function addEdges(mesh, color = palette.ink, scale = 1.003) {
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry, 25),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.78 })
      );
      edges.scale.setScalar(scale);
      mesh.add(edges);
      return edges;
    }

    function aabbForPosition(position, halfWidth = 1, halfDepth = 1) {
      return {
        minX: position.x - halfWidth,
        maxX: position.x + halfWidth,
        minZ: position.z - halfDepth,
        maxZ: position.z + halfDepth
      };
    }

    function aabbOverlap(a, b) {
      return a.minX < b.maxX && a.maxX > b.minX && a.minZ < b.maxZ && a.maxZ > b.minZ;
    }

    function positionBlocked(position, radius, obstacles, ignore = null) {
      if (
        position.x - radius < arenaBounds.minX ||
        position.x + radius > arenaBounds.maxX ||
        position.z - radius < arenaBounds.minZ ||
        position.z + radius > arenaBounds.maxZ
      ) {
        return true;
      }
      const tankBox = aabbForPosition(position, radius, radius);
      return obstacles.some((obstacle) => obstacle !== ignore && aabbOverlap(tankBox, obstacle.bounds));
    }

    function lineBlocked(start, end, obstacles) {
      const distance = start.distanceTo(end);
      const steps = Math.max(8, Math.ceil(distance / 0.7));
      for (let i = 1; i < steps; i++) {
        tmpVec.lerpVectors(start, end, i / steps);
        const hit = obstacles.some((obstacle) => {
          const b = obstacle.bounds;
          return tmpVec.x > b.minX && tmpVec.x < b.maxX && tmpVec.z > b.minZ && tmpVec.z < b.maxZ;
        });
        if (hit) return true;
      }
      return false;
    }

    class TankHealth {
      constructor(maxHealth, onDeath) {
        this.maxHealth = maxHealth;
        this.current = maxHealth;
        this.onDeath = onDeath;
        this.dead = false;
      }

      damage(amount) {
        if (this.dead) return;
        this.current = Math.max(0, this.current - amount);
        if (this.current <= 0) {
          this.dead = true;
          this.onDeath?.();
        }
      }

      get percent() {
        return this.current / this.maxHealth;
      }
    }

    class TankController {
      constructor({ scene, position, team, color, wash, isPlayer = false, game, archetype = "striker" }) {
        this.scene = scene;
        this.team = team;
        this.archetype = tankArchetypes[archetype] || tankArchetypes.striker;
        this.color = color;
        this.wash = wash;
        this.isPlayer = isPlayer;
        this.game = game;
        this.group = new THREE.Group();
        this.group.position.set(position[0], 0.45, position[1]);
        this.heading = isPlayer ? 0 : Math.PI;
        this.turretHeading = this.heading;
        this.speed = 0;
        this.radius = 1.1;
        this.maxSpeed = this.archetype.maxSpeed * (isPlayer ? 1 : 0.82);
        this.acceleration = this.archetype.acceleration * (isPlayer ? 1 : 0.8);
        this.turnSpeed = this.archetype.turnSpeed;
        this.turretTurnSpeed = this.archetype.turretTurnSpeed;
        this.fireCooldown = 0;
        this.fireDelay = this.archetype.fireDelay * (isPlayer ? 1 : 1.25);
        this.damage = this.archetype.damage;
        this.health = new TankHealth(this.archetype.maxHealth * (isPlayer ? 1 : 0.7), () => this.destroy());
        this.buildMesh();
        scene.add(this.group);
      }

      buildMesh() {
        const bodyMat = makeMaterial(this.wash);
        const inkMat = makeMaterial(this.color);
        const darkMat = makeMaterial(0x201f1c);

        const scale = this.archetype.bodyScale;
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.8 * scale[0], 0.65 * scale[1], 2.5 * scale[2]), bodyMat);
        body.position.y = 0.45;
        body.castShadow = true;
        addEdges(body);
        this.group.add(body);

        const nose = new THREE.Mesh(new THREE.BoxGeometry(1.35 * scale[0], 0.46 * scale[1], 0.72 * scale[2]), inkMat);
        nose.position.set(0, 0.6, -0.88);
        nose.castShadow = true;
        addEdges(nose);
        this.group.add(nose);

        for (const x of [-1.05, 1.05]) {
          const track = new THREE.Mesh(new THREE.BoxGeometry(0.34 * scale[0], 0.4 * scale[1], 2.75 * scale[2]), darkMat);
          track.position.set(x * scale[0], 0.28, 0);
          track.castShadow = true;
          addEdges(track, palette.ink);
          this.group.add(track);
        }

        this.turret = new THREE.Group();
        this.turret.position.y = 0.95;
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 0.32, 18), inkMat);
        base.castShadow = true;
        addEdges(base);
        this.turret.add(base);

        const barrelLength = this.archetype.label === "Rail" ? 2.65 : this.archetype.label === "Heavy" ? 1.75 : 1.95;
        const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.24, barrelLength), inkMat);
        barrel.position.set(0, 0.03, -barrelLength * 0.55);
        barrel.castShadow = true;
        addEdges(barrel);
        this.turret.add(barrel);

        this.muzzle = new THREE.Object3D();
        this.muzzle.position.set(0, 0.03, -barrelLength - 0.18);
        this.turret.add(this.muzzle);
        this.group.add(this.turret);

        this.healthBar = new THREE.Group();
        const frame = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.08, 0.08), makeMaterial(palette.ink));
        this.healthFill = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.1, 0.1), makeMaterial(this.color));
        this.healthFill.position.z = -0.01;
        this.healthBar.add(frame, this.healthFill);
        this.healthBar.position.set(0, 2.0, 0);
        this.healthBar.visible = !this.isPlayer;
        this.group.add(this.healthBar);
      }

      update(dt) {
        this.fireCooldown = Math.max(0, this.fireCooldown - dt);
        this.group.rotation.y = this.heading;
        this.turret.rotation.y = this.turretHeading - this.heading;
        if (this.healthFill) {
          this.healthFill.scale.x = clamp(this.health.percent, 0.001, 1);
          this.healthFill.position.x = -0.81 + 0.81 * this.health.percent;
        }
        if (this.healthBar) {
          this.healthBar.lookAt(this.game.camera.position);
        }
      }

      move(dt, throttle, steering) {
        this.speed += throttle * this.acceleration * dt;
        this.speed *= throttle === 0 ? Math.pow(0.16, dt) : Math.pow(0.72, dt);
        this.speed = clamp(this.speed, -this.maxSpeed * 0.55, this.maxSpeed);
        if (Math.abs(this.speed) > 0.08) {
          this.heading = normalizeAngle(this.heading + steering * this.turnSpeed * dt * Math.sign(this.speed));
        }

        const next = this.group.position.clone();
        next.x -= Math.sin(this.heading) * this.speed * dt;
        next.z -= Math.cos(this.heading) * this.speed * dt;
        if (!positionBlocked(next, this.radius, this.game.obstacles)) {
          this.group.position.copy(next);
        } else {
          this.speed *= -0.18;
        }
      }

      rotateTurret(dt, direction) {
        this.turretHeading = normalizeAngle(this.turretHeading + direction * this.turretTurnSpeed * dt);
      }

      aimTurretAt(target, dt, speedScale = 1) {
        const dx = target.x - this.group.position.x;
        const dz = target.z - this.group.position.z;
        const desired = Math.atan2(-dx, -dz);
        const diff = angleDiff(desired, this.turretHeading);
        const step = this.turretTurnSpeed * speedScale * dt;
        this.turretHeading = normalizeAngle(this.turretHeading + clamp(diff, -step, step));
        return Math.abs(diff);
      }

      fire(ownerTeam, special = false) {
        if ((!special && this.fireCooldown > 0) || this.health.dead) return false;
        this.muzzle.getWorldPosition(tmpVec);
        const direction = new THREE.Vector3(-Math.sin(this.turretHeading), 0, -Math.cos(this.turretHeading));
        this.game.spawnProjectile(tmpVec.clone(), direction, ownerTeam, special, this.damage);
        this.fireCooldown = special ? Math.max(this.fireCooldown, 0.35) : this.fireDelay;
        return true;
      }

      destroy() {
        this.group.visible = false;
        this.game.spawnSplatter(this.group.position, this.color, 2.5);
      }
    }

    class EnemyTankAI {
      constructor(tank, game) {
        this.tank = tank;
        this.game = game;
        this.stateTimer = Math.random() * 2;
        this.patrolAngle = Math.random() * TAU;
      }

      update(dt) {
        if (this.tank.health.dead || this.game.player.health.dead) return;
        const targetTank = this.tank.team === "ally"
          ? this.game.closestLivingEnemy(this.tank.group.position)
          : this.game.player;
        if (!targetTank) return;
        const player = targetTank;
        const enemyPos = this.tank.group.position;
        const playerPos = player.group.position;
        const distance = enemyPos.distanceTo(playerPos);
        const canSee = distance < 18 && !lineBlocked(enemyPos, playerPos, this.game.obstacles);

        if (canSee) {
          const aimError = this.tank.aimTurretAt(playerPos, dt, 1.15);
          const targetAngle = Math.atan2(enemyPos.x - playerPos.x, enemyPos.z - playerPos.z);
          const turn = clamp(angleDiff(targetAngle, this.tank.heading), -1, 1);
          const throttle = distance > 8 ? 0.8 : distance < 5 ? -0.35 : 0;
          this.tank.move(dt, throttle, turn);
          if (distance < 24 && aimError < 0.16) this.tank.fire("enemy");
        } else {
          this.stateTimer -= dt;
          if (this.stateTimer <= 0) {
            this.stateTimer = 1.2 + Math.random() * 2.2;
            this.patrolAngle = Math.random() * TAU;
          }
          const turn = clamp(angleDiff(this.patrolAngle, this.tank.heading), -0.8, 0.8);
          this.tank.move(dt, 0.42, turn);
          this.tank.aimTurretAt(
            tmpVec.set(
              enemyPos.x - Math.sin(this.tank.heading) * 5,
              enemyPos.y,
              enemyPos.z - Math.cos(this.tank.heading) * 5
            ),
            dt,
            0.6
          );
        }

        this.tank.update(dt);
      }
    }

    class Projectile {
      constructor({ scene, position, direction, owner, game, special = false, damage = 18 }) {
        this.scene = scene;
        this.owner = owner;
        this.game = game;
        this.position = position.clone();
        this.direction = direction.clone().normalize();
        this.special = special;
        this.speed = special ? 13 : 20;
        this.damage = special ? 48 : damage;
        this.radius = special ? 0.72 : 0.25;
        this.splashRadius = special ? 5.2 : 0;
        this.life = special ? 3.2 : 2.6;
        const projectileGroup = new THREE.Group();
        const drop = new THREE.Mesh(
          new THREE.SphereGeometry(this.radius, 18, 12),
          makeMaterial(owner === "player" ? palette.blue : palette.red, 0.55)
        );
        drop.scale.set(1, 0.72, special ? 1.55 : 1.15);
        const tail = new THREE.Mesh(
          new THREE.ConeGeometry(this.radius * 0.7, special ? 2.2 : 1.1, 16),
          makeMaterial(owner === "player" ? palette.blue : palette.red, 0.7)
        );
        tail.rotation.x = Math.PI / 2;
        tail.position.z = special ? 1.2 : 0.72;
        projectileGroup.add(drop, tail);
        this.mesh = projectileGroup;
        this.mesh.position.copy(this.position);
        this.mesh.traverse((child) => { if (child.isMesh) child.castShadow = true; });
        scene.add(this.mesh);
      }

      update(dt) {
        this.life -= dt;
        this.position.addScaledVector(this.direction, this.speed * dt);
        this.mesh.position.copy(this.position);

        if (
          this.life <= 0 ||
          this.position.x < arenaBounds.minX - 2 ||
          this.position.x > arenaBounds.maxX + 2 ||
          this.position.z < arenaBounds.minZ - 2 ||
          this.position.z > arenaBounds.maxZ + 2
        ) {
          this.dispose(false);
          return false;
        }

        for (const obstacle of this.game.obstacles) {
          const b = obstacle.bounds;
          if (this.position.x > b.minX && this.position.x < b.maxX && this.position.z > b.minZ && this.position.z < b.maxZ) {
            this.dispose(true);
            return false;
          }
        }

        const targets = this.owner === "player" ? this.game.enemies.map((enemy) => enemy.tank) : [this.game.player];
        for (const target of targets) {
          if (target.health.dead) continue;
          if (this.position.distanceTo(target.group.position) < target.radius + this.radius) {
            this.hitTarget(target);
            this.dispose(true);
            return false;
          }
        }
        return true;
      }

      hitTarget(primaryTarget) {
        primaryTarget.health.damage(this.damage);
        if (this.special) {
          const targetList = this.owner === "player" ? this.game.enemies.map((enemy) => enemy.tank) : [this.game.player, ...this.game.allies.map((ally) => ally.tank)];
          for (const target of targetList) {
            if (target === primaryTarget || target.health.dead) continue;
            const dist = this.position.distanceTo(target.group.position);
            if (dist <= this.splashRadius) target.health.damage(Math.round(this.damage * (1 - dist / this.splashRadius) * 0.75));
          }
          this.game.showMessage("Full ink splash landed!");
        }
      }

      dispose(makeSplatter) {
        this.scene.remove(this.mesh);
        this.mesh.traverse((child) => {
          if (!child.isMesh) return;
          child.geometry.dispose();
          child.material.dispose();
        });
        if (makeSplatter) {
          this.game.spawnSplatter(this.position, this.owner === "player" ? palette.blue : palette.red, this.special ? 4.8 : 1.4);
        }
      }
    }

    class LevelDefinition {
      constructor(data) {
        Object.assign(this, data);
      }
    }

    class GameManager {
      constructor() {
        this.levelIndex = 0;
        this.clock = new THREE.Clock();
        this.projectiles = [];
        this.obstacles = [];
        this.enemies = [];
        this.allies = [];
        this.splatters = [];
        this.objectives = [];
        this.flags = {};
        this.modeIndex = 0;
        this.teamScore = { blue: 0, red: 0 };
        this.specialCharge = 0;
        this.spaceHeld = false;
        this.gameOver = false;
        this.messageTimer = 0;
        this.setupScene();
        this.bindInput();
        this.loadLevel(0);
        this.animate();
      }

      setupScene() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0xded8c6);
        this.scene.fog = new THREE.Fog(0xded8c6, 28, 58);

        this.camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.1, 120);
        this.camera.position.set(-8, 9, 12);

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        ui.root.appendChild(this.renderer.domElement);

        const hemi = new THREE.HemisphereLight(0xfff7e4, 0xb9b097, 2.2);
        this.scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xffffff, 2.6);
        sun.position.set(-8, 16, 10);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.left = -30;
        sun.shadow.camera.right = 30;
        sun.shadow.camera.top = 24;
        sun.shadow.camera.bottom = -24;
        this.scene.add(sun);

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(50, 34),
          new THREE.MeshStandardMaterial({
            map: createPaperTexture(),
            roughness: 0.95,
            metalness: 0
          })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        this.scene.add(floor);

        const borderMat = makeMaterial(palette.ink);
        const borderPieces = [
          [0, arenaBounds.minZ - 0.35, arenaBounds.maxX - arenaBounds.minX + 1.4, 0.7],
          [0, arenaBounds.maxZ + 0.35, arenaBounds.maxX - arenaBounds.minX + 1.4, 0.7],
          [arenaBounds.minX - 0.35, 0, 0.7, arenaBounds.maxZ - arenaBounds.minZ + 1.4],
          [arenaBounds.maxX + 0.35, 0, 0.7, arenaBounds.maxZ - arenaBounds.minZ + 1.4]
        ];
        for (const [x, z, w, d] of borderPieces) {
          const border = new THREE.Mesh(new THREE.BoxGeometry(w, 0.6, d), borderMat);
          border.position.set(x, 0.3, z);
          border.castShadow = true;
          border.receiveShadow = true;
          addEdges(border);
          this.scene.add(border);
        }

        window.addEventListener("resize", () => this.resize());
      }

      bindInput() {
        document.addEventListener("keydown", (event) => {
          keys.add(event.code);
          if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
            event.preventDefault();
          }
          if (event.code === "KeyR") this.loadLevel(this.levelIndex);
          if (event.code === "KeyN") this.loadLevel(this.levelIndex + 1);
          if (event.code === "KeyP") this.loadLevel(this.levelIndex - 1);
          if (event.code === "KeyM") this.cycleMode();
        });
        document.addEventListener("keyup", (event) => keys.delete(event.code));
        ui.restartButton.addEventListener("click", () => this.loadLevel(this.levelIndex));
        ui.nextButton.addEventListener("click", () => this.loadLevel(this.levelIndex + 1));
      }

      clearLevel() {
        for (const projectile of this.projectiles) projectile.dispose(false);
        this.projectiles = [];

        for (const enemy of this.enemies) this.scene.remove(enemy.tank.group);
        this.enemies = [];

        for (const ally of this.allies) this.scene.remove(ally.tank.group);
        this.allies = [];

        if (this.player) this.scene.remove(this.player.group);

        for (const obstacle of this.obstacles) {
          this.scene.remove(obstacle.mesh);
          obstacle.mesh.geometry.dispose();
          obstacle.mesh.material.dispose();
        }
        this.obstacles = [];

        for (const objective of this.objectives) this.scene.remove(objective.mesh);
        this.objectives = [];
        for (const flag of Object.values(this.flags)) this.scene.remove(flag);
        this.flags = {};

        for (const splatter of this.splatters) {
          this.scene.remove(splatter);
          splatter.geometry.dispose();
          splatter.material.dispose();
        }
        this.splatters = [];
      }

      loadLevel(index) {
        this.clearLevel();
        this.gameOver = false;
        ui.overlay.classList.remove("visible");
        this.levelIndex = (index + levels.length) % levels.length;
        const level = new LevelDefinition(levels[this.levelIndex]);
        this.currentMode = gameModes.includes(level.mode) ? level.mode : gameModes[this.modeIndex];
        ui.levelName.textContent = `Page ${this.levelIndex + 1}: ${level.name}`;
        ui.modeText.textContent = `Mode ${this.currentMode}`;
        this.teamScore = { blue: 0, red: 0 };
        this.specialCharge = 0;

        for (const def of level.obstacles) {
          const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(def.w, def.h, def.d),
            makeMaterial(0xede5cf)
          );
          mesh.position.set(def.x, def.h / 2, def.z);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          addEdges(mesh, palette.ink);
          this.scene.add(mesh);
          this.obstacles.push({
            mesh,
            bounds: {
              minX: def.x - def.w / 2,
              maxX: def.x + def.w / 2,
              minZ: def.z - def.d / 2,
              maxZ: def.z + def.d / 2
            }
          });
        }

        this.player = new TankController({
          scene: this.scene,
          position: level.player,
          team: "player",
          color: palette.blue,
          wash: palette.blueWash,
          isPlayer: true,
          game: this,
          archetype: "striker"
        });

        for (const enemyDef of level.enemies) {
          const position = [enemyDef[0], enemyDef[1]];
          const tank = new TankController({
            scene: this.scene,
            position,
            team: "enemy",
            color: palette.red,
            wash: palette.redWash,
            game: this,
            archetype: enemyDef[2] || "striker"
          });
          this.enemies.push(new EnemyTankAI(tank, this));
        }

        for (const allyDef of level.allies || []) {
          const tank = new TankController({
            scene: this.scene,
            position: [allyDef[0], allyDef[1]],
            team: "ally",
            color: palette.blue,
            wash: palette.blueWash,
            game: this,
            archetype: allyDef[2] || "scout"
          });
          this.allies.push(new EnemyTankAI(tank, this));
        }

        this.createObjectives(level);

        this.showMessage(`Sketchbook page ${this.levelIndex + 1}: erase ${this.enemies.length} hostile ink tanks.`);
        this.updateHUD();
      }

      spawnProjectile(position, direction, owner, special = false, damage = 18) {
        this.projectiles.push(new Projectile({
          scene: this.scene,
          position,
          direction,
          owner,
          game: this,
          special,
          damage
        }));
      }

      closestLivingEnemy(position) {
        let closest = null;
        let closestDistance = Infinity;
        for (const enemy of this.enemies) {
          if (enemy.tank.health.dead) continue;
          const dist = enemy.tank.group.position.distanceTo(position);
          if (dist < closestDistance) {
            closest = enemy.tank;
            closestDistance = dist;
          }
        }
        return closest;
      }

      createObjectives(level) {
        const pointMat = new THREE.MeshBasicMaterial({ color: palette.blue, transparent: true, opacity: 0.18, side: THREE.DoubleSide });
        for (const obj of level.objectives || []) {
          const mesh = new THREE.Mesh(new THREE.CircleGeometry(obj.r, 36), pointMat.clone());
          mesh.rotation.x = -Math.PI / 2;
          mesh.position.set(obj.x, 0.025, obj.z);
          this.scene.add(mesh);
          this.objectives.push({ ...obj, mesh, owner: null, capture: 0 });
        }
        if (level.flags) {
          for (const [team, pos] of Object.entries(level.flags)) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.6, 10), makeMaterial(team === "blue" ? palette.blue : palette.red));
            pole.position.set(pos[0], 1.3, pos[1]);
            this.scene.add(pole);
            this.flags[team] = pole;
          }
        }
      }

      cycleMode() {
        this.modeIndex = (this.modeIndex + 1) % gameModes.length;
        this.currentMode = gameModes[this.modeIndex];
        ui.modeText.textContent = `Mode ${this.currentMode}`;
        this.showMessage(`Mode switched to ${this.currentMode}.`);
      }

      spawnSplatter(position, color, scale) {
        const geometry = new THREE.CircleGeometry(scale, 18);
        const material = new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.28,
          depthWrite: false
        });
        const splatter = new THREE.Mesh(geometry, material);
        splatter.rotation.x = -Math.PI / 2;
        splatter.position.set(position.x, 0.018, position.z);
        splatter.scale.set(1, 0.55 + Math.random() * 0.6, 1);
        splatter.rotation.z = Math.random() * TAU;
        this.scene.add(splatter);
        this.splatters.push(splatter);
      }

      showMessage(text) {
        ui.message.textContent = text;
        ui.message.classList.add("visible");
        this.messageTimer = 3;
      }

      updatePlayer(dt) {
        let throttle = 0;
        let steering = 0;
        let turret = 0;

        if (keys.has("KeyW") || keys.has("ArrowUp")) throttle += 1;
        if (keys.has("KeyS") || keys.has("ArrowDown")) throttle -= 1;
        if (keys.has("KeyA") || keys.has("ArrowLeft")) steering += 1;
        if (keys.has("KeyD") || keys.has("ArrowRight")) steering -= 1;
        if (keys.has("KeyQ") || keys.has("KeyZ")) turret += 1;
        if (keys.has("KeyE") || keys.has("KeyX")) turret -= 1;

        if (throttle === 0) steering = 0;
        this.player.move(dt, throttle, steering);
        this.player.rotateTurret(dt, turret);

        const holdingSpace = keys.has("Space");
        if (holdingSpace) {
          this.specialCharge = clamp(this.specialCharge + dt * 0.42, 0, 1);
          if (this.specialCharge >= 1) {
            this.player.fire("player", true);
            this.specialCharge = 0;
            this.spaceHeld = false;
          }
        } else if (this.spaceHeld) {
          if (this.specialCharge < 0.45) this.player.fire("player", false);
          this.specialCharge = 0;
        }
        this.spaceHeld = holdingSpace;
        this.player.update(dt);
      }

      updateCamera(dt) {
        const tank = this.player;
        const back = new THREE.Vector3(Math.sin(tank.heading) * 11.5, 8.2, Math.cos(tank.heading) * 11.5);
        const desired = tank.group.position.clone().add(back);
        desired.y += 2.0;
        this.camera.position.lerp(desired, 1 - Math.pow(0.001, dt));
        tmpVec.copy(tank.group.position);
        tmpVec.y += 1.4;
        tmpVec.x -= Math.sin(tank.turretHeading) * 3.2;
        tmpVec.z -= Math.cos(tank.turretHeading) * 3.2;
        this.camera.lookAt(tmpVec);
      }

      updateHUD() {
        const health = Math.ceil(this.player?.health.current ?? 0);
        ui.healthText.textContent = `${health}`;
        const healthPct = this.player ? this.player.health.percent * 100 : 0;
        ui.healthFill.style.width = `${clamp(healthPct, 0, 100)}%`;
        ui.specialFill.style.width = `${Math.round(this.specialCharge * 100)}%`;
        const aliveEnemies = this.enemies.filter((enemy) => !enemy.tank.health.dead).length;
        ui.enemyText.textContent = `Enemies ${aliveEnemies}`;
        ui.modeText.textContent = `Mode ${this.currentMode || "Deathmatch"}`;
      }

      updateObjectives(dt) {
        if (this.currentMode !== "Control Points") return;
        const playerPos = this.player.group.position;
        for (const objective of this.objectives) {
          const dist = Math.hypot(playerPos.x - objective.x, playerPos.z - objective.z);
          if (dist < objective.r) {
            objective.capture = clamp(objective.capture + dt * 0.45, 0, 1);
            objective.mesh.material.color.setHex(palette.blue);
            objective.mesh.material.opacity = 0.18 + objective.capture * 0.28;
          }
        }
      }

      checkEndState() {
        if (this.gameOver) return;
        if (this.player.health.dead) {
          this.endGame("Erased!", "Your tank was smudged out of the page.");
          return;
        }
        const aliveEnemies = this.enemies.filter((enemy) => !enemy.tank.health.dead);
        if (this.currentMode === "Control Points" && this.objectives.length && this.objectives.every((objective) => objective.capture >= 1)) {
          this.endGame("Victory!", "All ink control points belong to your team.");
          return;
        }
        if (this.currentMode === "Capture The Flag" && this.flags.red && this.player.group.position.distanceTo(this.flags.red.position) < 3.2) {
          this.endGame("Victory!", "Enemy flag soaked. Bring that one to the scrapbook.");
          return;
        }
        if (aliveEnemies.length === 0) {
          const label = this.currentMode === "Team Deathmatch" ? "Enemy team erased." : "Page cleared. The hostile ink tanks have been erased.";
          this.endGame("Victory!", label);
        }
      }

      endGame(title, body) {
        this.gameOver = true;
        ui.overlayTitle.textContent = title;
        ui.overlayTitle.style.color = title === "Victory!" ? "#1e8a50" : "#c7262e";
        ui.overlayBody.textContent = body;
        ui.overlay.classList.add("visible");
      }

      resize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }

      animate() {
        requestAnimationFrame(() => this.animate());
        const dt = Math.min(0.033, this.clock.getDelta());
        if (!this.gameOver) {
          this.updatePlayer(dt);
          for (const enemy of this.enemies) enemy.update(dt);
          for (const ally of this.allies) ally.update(dt);
          this.projectiles = this.projectiles.filter((projectile) => projectile.update(dt));
          this.updateObjectives(dt);
          this.checkEndState();
        }
        this.updateCamera(dt);
        this.updateHUD();
        if (this.messageTimer > 0) {
          this.messageTimer -= dt;
          if (this.messageTimer <= 0) ui.message.classList.remove("visible");
        }
        this.renderer.render(this.scene, this.camera);
      }
    }

    try {
      new GameManager();
    } catch (error) {
      console.error(error);
      ui.fallback.style.display = "block";
    }
  </script>
